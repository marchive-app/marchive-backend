spring:
  application:
    name: marchive-backend
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}

google:
  client-id: ${GOOGLE_CLIENT_ID}

qdrant:
  host: ${DB_HOST}
  port: 6334

aws:
  region: ap-northeast-2
  s3:
    bucket: marchive-s3-478982785818