name: Deploy to Dev Server

on:
  workflow_dispatch:

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marchive-backend:dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.DEV_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[      
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/marchive-backend:dev",
              "docker stop marchive-backend-dev || true",
              "docker rm marchive-backend-dev || true",
              "docker run -d --name marchive-backend-dev --network host -p 8080:8080 -e SPRING_PROFILES_ACTIVE=dev -e DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }} -e DEV_JWT_SECRET=${{ secrets.DEV_JWT_SECRET }} -e DEV_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/marchive-backend:dev"
            ]}' \
            --region ap-northeast-2